name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The image runs as user rocq (uid 1000), which must be able to write
      # build outputs into the checkout.
      - name: Let the container user write to the checkout
        run: chmod -R a+w .

      - name: Build with Rocq 9.2
        run: docker run --rm -v "$PWD":/w -w /w rocq/rocq-prover:9.2 make
